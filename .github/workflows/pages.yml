name: Deploy Ritmi to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare app shell
        run: |
          mkdir -p site
          cp index.html site/index.html
          cp community.html site/community.html
          cp manifest.webmanifest site/manifest.webmanifest
          cp sw.js site/sw.js
          cp icon.svg site/icon.svg
          cp ritmi-addon.js site/ritmi-addon.js
          cp ritmi-storage-v4.js site/ritmi-storage-v4.js
          cp ritmi-storage-controls-v4.js site/ritmi-storage-controls-v4.js
          cp ritmi-community-v1.js site/ritmi-community-v1.js
          cp ritmi-experience-v1.js site/ritmi-experience-v1.js
          cp community-feed.json site/community-feed.json
      - name: Deploy
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
