name: Activate Ritmi v4 storage
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  activate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Switch bootstrap
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          storage='<script src="./ritmi-storage-v4.js"></script>'
          legacy='<script src="./ritmi-addon.js"></script>'
          if storage not in s:
              if legacy not in s:
                  raise SystemExit('Expected legacy addon script tag was not found')
              s=s.replace(legacy,storage,1)
              p.write_text(s)
          PY
      - name: Commit activation
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'v4 storage already active.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Activate Ritmi v4 IndexedDB storage'
          git push origin HEAD:main