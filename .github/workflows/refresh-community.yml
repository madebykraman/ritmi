name: Refresh Ritmi community feed
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public community and news sources
        shell: python
        run: |
          import json, re, urllib.parse, urllib.request, xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from pathlib import Path

          UA='Ritmi/1.0 public-community-index (+https://github.com/madebykraman/ritmi)'
          def get(url):
              r=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'application/json,text/xml;q=0.9,*/*;q=0.8'})
              with urllib.request.urlopen(r,timeout=20) as x: return x.read()

          items=[]
          subs=['Periods','TheGirlSurvivalGuide','menstruation','AskIndianWomen']
          for sub in subs:
              try:
                  data=json.loads(get(f'https://www.reddit.com/r/{sub}/new.json?limit=8&raw_json=1'))
                  for child in data.get('data',{}).get('children',[]):
                      d=child.get('data',{})
                      title=(d.get('title') or '').strip()
                      permalink=d.get('permalink')
                      if title and permalink:
                          items.append({'type':'reddit','title':title,'source':f'Reddit · r/{sub}','url':'https://www.reddit.com'+permalink,'published':datetime.fromtimestamp(float(d.get('created_utc',0)),timezone.utc).date().isoformat(),'label':'Community discussion'})
              except Exception as e:
                  print('Reddit source failed',sub,e)

          queries=['menstrual health','period tracking privacy','menstruation health']
          for q in queries:
              try:
                  url='https://news.google.com/rss/search?'+urllib.parse.urlencode({'q':q,'hl':'en-IN','gl':'IN','ceid':'IN:en'})
                  root=ET.fromstring(get(url))
                  for node in root.findall('./channel/item')[:8]:
                      title=(node.findtext('title') or '').strip(); link=(node.findtext('link') or '').strip(); pub=(node.findtext('pubDate') or '').strip()
                      if title and link:
                          items.append({'type':'news','title':re.sub(r'\s+-\s+[^-]+$','',title).strip(),'source':'News · public RSS','url':link,'published':pub[:31],'label':'News & research'})
              except Exception as e:
                  print('News source failed',q,e)

          seen=set(); clean=[]
          for x in sorted(items,key=lambda z:z.get('published',''),reverse=True):
              key=(x['type'],x['url'])
              if key in seen: continue
              seen.add(key); clean.append(x)
          Path('community-feed.json').write_text(json.dumps({'updated':datetime.now(timezone.utc).isoformat(),'items':clean[:40]},ensure_ascii=False,indent=2)+'\n')
      - name: Commit refreshed feed
        shell: bash
        run: |
          if git diff --quiet -- community-feed.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add community-feed.json
          git commit -m 'Refresh anonymized community feed'
          git push origin HEAD:main
