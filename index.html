<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f8f5f2"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Ritmi"><meta name="description" content="Ritmi. A free, local-first cycle companion."><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>Ritmi</title><link rel="stylesheet" href="./rebuild-v5.css"></head><body class="ritmi-rebuild"><div id="ritmi-boot" style="min-height:100vh;display:grid;place-items:center;padding:32px;background:#f8f5f2;color:#302b30;font:500 17px/1.5 system-ui,-apple-system,sans-serif;text-align:center"><div><div style="font:700 34px/1.1 Georgia,serif;letter-spacing:-.04em">ritmi</div><div style="margin-top:10px;opacity:.65">Opening your local data…</div></div></div><noscript>Ritmi needs JavaScript.</noscript><script>if("serviceWorker" in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{})}</script><script>
(()=>{'use strict';
const key='ritmi-v3',fallback='ritmi-local-v7';
const fresh=()=>({version:4,settings:{cycleLength:28,periodLength:5,mode:'self',reduceMotion:false,privateDisplay:false},profiles:[{id:'self',name:'My cycle',type:'self'}],activeProfile:'self',periods:[],logs:{},notes:{},cycles:[],customSignals:[],reminders:[],communityDrafts:[],activeProfile:'self',onboarded:false});
const migrate=x=>{const n=fresh();n.settings={...n.settings,...(x?.settings||{})};n.profiles=Array.isArray(x?.profiles)&&x.profiles.length?x.profiles:n.profiles;n.activeProfile=x?.activeProfile||n.profiles[0].id;n.periods=Array.isArray(x?.periods)?x.periods:[];n.logs=x?.logs&&typeof x.logs==='object'?x.logs:{};n.notes=x?.journal&&typeof x.journal==='object'?x.journal:(x?.notes||{});n.customSignals=Array.isArray(x?.customSignals)?x.customSignals:[];n.reminders=Array.isArray(x?.reminders)?x.reminders:[];n.communityDrafts=Array.isArray(x?.communityDrafts)?x.communityDrafts:[];n.onboarded=!!x?.onboarded;return n};
let D=fresh();try{D=migrate(JSON.parse(localStorage.getItem(fallback)||localStorage.getItem(key)||'null'))}catch{}
const clone=x=>JSON.parse(JSON.stringify(x));const persist=()=>{try{localStorage.setItem(fallback,JSON.stringify(D))}catch{}};
window.RitmiStorage={version:4,dbName:'local-bootstrap',ready:true,backend:'localStorage',snapshot:async()=>clone(D),profileSnapshot:async id=>{const x=clone(D);x.activeProfile=id;x.periods=[];x.logs={};x.notes={};return x},save:async x=>{D=migrate(x);persist()},clear:async()=>{D=fresh();persist()},persistent:async()=>false,estimate:async()=>null};
window.__RitmiStorageReady=true;
window.dispatchEvent(new Event('ritmi-storage-ready'));
})();
</script>
<script src="./ritmi-storage-v7.js"></script><script src="./rebuild-v8.js"></script></body></html>
